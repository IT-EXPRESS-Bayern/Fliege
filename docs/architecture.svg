<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 490" role="img" aria-labelledby="title desc">
  <title id="title">FLIEGE: von Originaldaten zum Körpermodell</title>
  <desc id="desc">Originaldaten und Literatur führen über Provenienz und anatomische Zuordnung zu neuronalen Teilmodellen. Die Kopplung an Körpermechanik und die sensorische Rückkopplung aus der 3D-Umgebung sind teilweise umgesetzt. Prüfungen begleiten die Auswertung.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#8ca7bb"/></marker>
    <marker id="hypothesis" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#e3ae60"/></marker>
    <style>
      text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#eef4f9}
      .box{fill:#142437;stroke:#35516b;stroke-width:1.5}
      .title{font-size:20px;font-weight:650;text-anchor:middle}
      .detail{font-size:15px;fill:#b5c6d5;text-anchor:middle}
      .line{fill:none;stroke:#8ca7bb;stroke-width:2;marker-end:url(#arrow)}
      .partial{fill:none;stroke:#e3ae60;stroke-width:2;stroke-dasharray:7 5;marker-end:url(#hypothesis)}
    </style>
  </defs>
  <rect width="1040" height="490" rx="16" fill="#0d1826"/>
  <rect class="box" x="30" y="40" width="280" height="100" rx="12"/>

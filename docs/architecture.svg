  <text class="title" x="520" y="280">Körpermechanik</text>
  <text class="detail" x="520" y="309">Motoren · Gelenke · Flügel</text>
  <rect class="box" x="30" y="240" width="280" height="100" rx="12"/>
  <text class="title" x="170" y="280">3D-Umgebung</text>
  <text class="detail" x="170" y="309">Körperzustand · Sinneseingänge</text>

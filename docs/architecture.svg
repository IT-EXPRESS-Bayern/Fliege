  <text class="detail" x="520" y="111">Versionen · IDs · Prüfsummen</text>
  <rect class="box" x="730" y="40" width="280" height="100" rx="12"/>
  <text class="title" x="870" y="81">Anatomische Zuordnung</text>
  <text class="detail" x="870" y="111">Zellidentitäten · strukturelle Wege</text>
  <path class="line" d="M310 90H371"/><path class="line" d="M660 90H721"/>
  <path class="line" d="M870 140V231"/>
  <rect class="box" x="730" y="240" width="280" height="100" rx="12"/>
  <text class="title" x="870" y="280">Neuronale Teilmodelle</text>
  <text class="detail" x="870" y="309">Annahmen · Dynamik · Kontrollen</text>
